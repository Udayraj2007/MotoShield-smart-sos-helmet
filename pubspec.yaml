name: smart_sos_helmet
description: Production-ready MotoShield application with BLE, Firebase and GPS.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ===========================
  # Firebase
  # ===========================
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0

  # ===========================
  # Notifications
  # ===========================
  flutter_local_notifications: ^19.0.0

  # ===========================
  # Google Sign In
  # ===========================
  google_sign_in: ^7.1.1

  # ===========================
  # State Management
  # ===========================
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ===========================
  # Navigation
  # ===========================
  go_router: ^16.0.0

  # ===========================
  # Bluetooth (ESP32)
  # ===========================
  flutter_blue_plus: ^2.3.12

  # ===========================
  # Permissions
  # ===========================
  permission_handler: ^12.0.1

  # ===========================
  # GPS
  # ===========================
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ===========================
  # Maps
  # ===========================
  google_maps_flutter: ^2.12.3

  # ===========================
  # Storage
  # ===========================
  shared_preferences: ^2.5.3

  # ===========================
  # ===========================
  # Networking & Voice TTS
  # ===========================
  connectivity_plus: ^7.0.0
  http: ^1.3.0
  flutter_tts: ^4.2.3

  # ===========================
  # Launch SMS / Calls
  # ===========================
  url_launcher: ^6.3.2

  # ===========================
  # Utilities
  # ===========================
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.1
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.0

  # ===========================
  # UI
  # ===========================
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  lottie: ^3.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/moto_shield.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/moto_shield.png"